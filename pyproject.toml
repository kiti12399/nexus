[project]
name = "keyshop-bot"
version = "0.1.0"
description = "Telegram bot for selling API keys with YooKassa payments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7,<4.0",
    "aiohttp>=3.9,<4.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.19,<1.0",
    "cryptography>=42,<47",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[project.scripts]
keyshop-bot = "keyshop_bot.main:run"
keyshop-fernet-key = "keyshop_bot.crypto:print_new_key"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
